<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bebê Friendly — Checklist & ROI | Praia Digital</title><meta name="description" content="Checklist de equipamentos para famílias com bebês e o retorno que eles geram na diária e nas avaliações."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#fdeef7,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #a34a8c22}h1{color:#8a3a76;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input{width:100%;padding:.6rem;border:2px solid #f0d8e9;border-radius:10px;font-size:1rem}.ck{display:flex;align-items:center;gap:.6rem;font-weight:400}.ck input{width:auto}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#a34a8c;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#fbeaf5;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#a34a8c;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/pet-friendly">Pet Friendly</a> · <a href="https://praia.digital/kit-boas-vindas">Kit Boas-Vindas</a> · <a href="https://praia.digital/checklist-anfitriao">Checklist Anfitrião</a></nav><div class="card"><h1>👶 Bebê Friendly</h1><p>Famílias com bebê são o público mais fiel da temporada. Marque o que você já tem:</p><label class="ck"><input type="checkbox" id="i1" data-v="180"> Berço portátil (R$ 180)</label><label class="ck"><input type="checkbox" id="i2" data-v="90"> Cadeirão de alimentação (R$ 90)</label><label class="ck"><input type="checkbox" id="i3" data-v="60"> Banheira de bebê (R$ 60)</label><label class="ck"><input type="checkbox" id="i4" data-v="45"> Protetores de tomada e quina (R$ 45)</label><label class="ck"><input type="checkbox" id="i5" data-v="120"> Carrinho de bebê disponível (R$ 120)</label><label class="ck"><input type="checkbox" id="i6" data-v="55"> Trocador portátil (R$ 55)</label><label>Diárias vendidas/mês</label><input id="v" type="number" value="12"><button onclick="calc()">Calcular ROI</button><div id="res"></div></div><script>function calc(){let inv=0,sel=0;document.querySelectorAll('.ck input').forEach(c=>{if(c.checked){inv+=+c.dataset.v;sel++}});const v=+document.getElementById('v').value;const completo=sel>=4;const premium=completo?35:sel*6,ganho=premium*v,payback=inv/ganho;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>🧸 Itens selecionados: <b>${sel}/6</b> — investimento <b>R$ ${inv}</b></p><p>🏷️ Selo "bebê friendly" ${completo?'✅ completo — destaque nos filtros do Airbnb!':'⚠️ incompleto — marque pelo menos 4 itens'}</p><p>📈 Prêmio estimado na diária: <b>+R$ ${premium}</b> → <b>R$ ${ganho}/mês</b> → payback em <b>${payback<=0?'0':payback.toFixed(1)} meses</b></p><p>💡 Famílias retornam todo ano: ative o ciclo no <a href="https://praia.digital/fideliza">Fideliza</a> e some com o selo pet no <a href="https://praia.digital/pet-friendly">Pet Friendly</a>.</p>`}</script></body></html>
